<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | StudySphere</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="auth-body">

    <div class="auth-container">
        <div class="auth-header">
            <div class="logo"><a href="../index.html">Study<span>Sphere</span></a></div>
            <h2>Reset Password</h2>
            <p>Enter the email address tied to your profile. We will forward a password initialization link.</p>
        </div>

        <form class="auth-form" action="reset-password.html" method="GET">
            <div class="form-group">
                <label for="reset-email">Email Address</label>
                <input type="email" id="reset-email" name="email" placeholder="you@example.com" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Send Reset Instructions</button>
        </form>

        <div class="auth-footer">
            <p>Remember your login? <a href="student-login.html" class="auth-link">Return to Sign In</a></p>
        </div>
    </div>

</body>
</html>
