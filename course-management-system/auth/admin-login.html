<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Login | StudySphere</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="auth-body">

    <div class="auth-container">
        <div class="auth-header">
            <div class="logo"><a href="../index.html">Study<span>Sphere</span></a></div>
            <h2>Admin Portal</h2>
            <p>Sign in to manage curriculum, track metrics, and review students.</p>
        </div>

        <form class="auth-form" action="../admin/admin-dashboard.html" method="GET">
            <div class="form-group">
                <label for="admin-email">Staff Email Address</label>
                <input type="email" id="admin-email" name="email" placeholder="name@studysphere.com" required>
            </div>

            <div class="form-group">
                <div class="label-wrapper">
                    <label for="admin-password">Password</label>
                    <a href="forgot-password.html" class="auth-link small">Forgot Password?</a>
                </div>
                <input type="password" id="admin-password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-dark btn-block">Access Console</button>
        </form>

        <div class="auth-footer">
            <p>Need an administrator account? <a href="admin-register.html" class="auth-link">Register institution</a></p>
            <p class="portal-switch">Looking for classes? <a href="student-login.html">Go to Student Login</a></p>
        </div>
    </div>

</body>
</html>
